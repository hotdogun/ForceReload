<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2 id="uiTitle">Force Reload</h2>
        <button id="themeBtn" class="theme-toggle-btn"></button>
    </div>

    <!-- 전체 기능 ON/OFF -->
    <div class="control-panel">
        <label class="switch-label">
            <span id="uiEnableLabel">Enable</span>
            <label class="switch">
                <input type="checkbox" id="masterToggle">
                <span class="slider"></span> <!-- round 클래스 제거, CSS에서 처리 -->
            </label>
        </label>
    </div>

    <!-- 사이트 추가 입력창 -->
    <div class="input-group">
        <input type="text" id="siteInput">
        <button id="addBtn"></button>
    </div>

    <!-- 사이트 리스트 -->
    <ul id="siteList"></ul>

    <script src="popup.js"></script>
</body>
</html>
